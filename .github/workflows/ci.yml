name: CoreForge CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Lint & Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Verify Python Code Compilation
        run: |
          python -m py_compile main.py

      - name: Test API Startup
        run: |
          python -c "import main; print('API initialized successfully with routes:', len(main.app.routes))"

      - name: Run Automated Pytest Suite
        run: |
          pytest -v tests/

  frontend-build:
    name: Frontend Build & Typecheck (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ai-dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ai-dashboard
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: ai-dashboard
        run: npx tsc --noEmit

      - name: ESLint Code Quality
        working-directory: ai-dashboard
        run: npm run lint

      - name: Next.js Production Build
        working-directory: ai-dashboard
        run: npm run build
