version: '3.8'

services:
  # 1. Ollama AI Model Engine
  ollama:
    image: ollama/ollama:latest
    container_name: coreforge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # 2. CoreForge FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: coreforge-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./nexus_memory.db:/app/nexus_memory.db
      - ./generations:/app/generations
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ollama
    restart: unless-stopped

  # 3. Next.js 16 Dashboard Frontend
  frontend:
    build:
      context: ./ai-dashboard
      dockerfile: Dockerfile
    container_name: coreforge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:
